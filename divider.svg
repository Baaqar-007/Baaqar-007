<svg viewBox="0 0 700 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B08D57" stop-opacity="0"/>
      <stop offset="50%" stop-color="#B08D57" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B08D57" stop-opacity="0"/>
    </linearGradient>
    <style>
      .rule { animation: shimmer 8s ease-in-out infinite; }
      @keyframes shimmer { 0%, 100% { opacity: 0.55; } 50% { opacity: 0.85; } }
