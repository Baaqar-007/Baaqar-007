<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="52%" r="50%">
      <stop offset="0%" stop-color="#C9A227" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <style>
      .pulse { animation: breathe 6s ease-in-out infinite; }
      @keyframes breathe {
        0%, 100% { opacity: 0.55; }
        50% { opacity: 1; }
      }
      .drift1 { animation: driftA 9s ease-in-out infinite; }
      .drift2 { animation: driftB 11s ease-in-out infinite; }
      .drift3 { animation: driftA 13s ease-in-out infinite reverse; }
      .drift4 { animation: driftB 8s ease-in-out infinite reverse; }
      .drift5 { animation: driftA 15s ease-in-out infinite; }
      @keyframes driftA {
        0%, 100% { transform: translate(0px, 0px); opacity: 0.2; }
        50% { transform: translate(6px, -16px); opacity: 0.85; }
      }
      @keyframes driftB {
        0%, 100% { transform: translate(0px, 0px); opacity: 0.15; }
        50% { transform: translate(-9px, -11px); opacity: 0.7; }
      }
    </style>
  </defs>

  <!-- glow in the doorway -->
  <ellipse class="pulse" cx="350" cy="128" rx="90" ry="108" fill="url(#glow)"/>

  <!-- pointed arch -->
  <path d="M250,222 L250,100 Q250,20 350,20 Q450,20 450,100 L450,222"
        fill="none" stroke="#C9A227" stroke-width="2" stroke-linecap="round" opacity="0.9"/>

  <!-- base flourish -->
  <path d="M228,224 L250,224 M450,224 L472,224" stroke="#C9A227" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- threshold line -->
  <line x1="150" y1="226" x2="550" y2="226" stroke="#C9A227" stroke-width="1" opacity="0.35"/>

  <!-- drifting embers -->
  <circle class="drift1" cx="130" cy="90" r="2.4" fill="#C9A227"/>
  <circle class="drift2" cx="580" cy="150" r="2" fill="#C9A227"/>
  <circle class="drift3" cx="95" cy="175" r="1.8" fill="#C9A227"/>
  <circle class="drift4" cx="610" cy="80" r="2.2" fill="#C9A227"/>
  <circle class="drift5" cx="350" cy="60" r="1.6" fill="#C9A227"/>
</svg>
