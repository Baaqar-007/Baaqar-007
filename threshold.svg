<svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D8CBAA" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D8CBAA" stop-opacity="0"/>
    </linearGradient>
    <style>
      .glass { animation: daylight 26s ease-in-out infinite; }
      @keyframes daylight {
        0%, 100% { opacity: 0.75; }
        50% { opacity: 1; }
      }
      .mote1 { animation: fall1 19s linear infinite; }
      .mote2 { animation: fall2 23s linear infinite; }
      @keyframes fall1 {
        0% { transform: translate(0, -6px); opacity: 0; }
        15% { opacity: 0.5; }
        85% { opacity: 0.4; }
        100% { transform: translate(4px, 46px); opacity: 0; }
      }
      @keyframes fall2 {
        0% { transform: translate(0, -6px); opacity: 0; }
        20% { opacity: 0.4; }
        80% { opacity: 0.3; }
        100% { transform: translate(-6px, 40px); opacity: 0; }
      }
    </style>
  </defs>

  <rect x="270" y="30" width="160" height="140" fill="none" stroke="#B08D57" stroke-width="1.5" opacity="0.75"/>
  <line x1="350" y1="30" x2="350" y2="170" stroke="#B08D57" stroke-width="1" opacity="0.5"/>
  <line x1="270" y1="100" x2="430" y2="100" stroke="#B08D57" stroke-width="1" opacity="0.5"/>

  <rect class="glass" x="278" y="38" width="66" height="124" fill="url(#light)"/>
  <rect class="glass" x="356" y="38" width="66" height="124" fill="url(#light)"/>

  <line x1="250" y1="172" x2="450" y2="172" stroke="#B08D57" stroke-width="1" opacity="0.4"/>

  <circle class="mote1" cx="305" cy="80" r="1.2" fill="#D8CBAA"/>
  <circle class="mote2" cx="390" cy="70" r="1" fill="#D8CBAA"/>
</svg>
